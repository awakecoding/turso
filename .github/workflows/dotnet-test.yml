name: Dotnet Tests

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  working-directory: bindings/dotnet

jobs:
  managed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ${{ env.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dotnet SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Run managed-only tests without Rust
        shell: bash
        run: |
          set -euo pipefail
          deny_directory="$PWD/.managed-toolchain-deny"
          mkdir -p "$deny_directory"
          trap 'rm -rf "$deny_directory"' EXIT
          for tool in cargo rustc; do
            printf '#!/usr/bin/env bash\necho "managed .NET validation must not invoke %s" >&2\nexit 97\n' "$tool" > "$deny_directory/$tool"
            chmod +x "$deny_directory/$tool"
          done
          PATH="$deny_directory:$PATH" CARGO="$deny_directory/cargo" RUSTC="$deny_directory/rustc" make test-managed

  managed-nativeaot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ${{ env.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dotnet SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify NativeAOT prerequisites
        shell: bash
        run: |
          set -euo pipefail
          clang --version
          test -f /usr/include/zlib.h

      - name: Validate managed NativeAOT closure without Rust
        shell: bash
        run: |
          set -euo pipefail
          deny_directory="$PWD/.managed-toolchain-deny"
          mkdir -p "$deny_directory"
          trap 'rm -rf "$deny_directory"' EXIT
          for tool in cargo rustc; do
            printf '#!/usr/bin/env bash\necho "managed NativeAOT validation must not invoke %s" >&2\nexit 97\n' "$tool" > "$deny_directory/$tool"
            chmod +x "$deny_directory/$tool"
          done
          PATH="$deny_directory:$PATH" CARGO="$deny_directory/cargo" RUSTC="$deny_directory/rustc" make validate-managed-nativeaot

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: 10

    defaults:
      run:
        working-directory: ${{ env.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust(stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup mold linker
        uses: rui314/setup-mold@v1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          cache-on-failure: true


      - name: Install dotnet SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Run native-inclusive tests
        run: make test-native
